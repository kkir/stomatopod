# Configuration used by the Playwright E2E test server.
# This file is intentionally committed — it contains only test credentials.

[auth]
secret_key = "playwright-e2e-secret-key"

[listen]
port = 18080

[storage]
backend = "embedded"
data_dir = "./data/e2e"
# Fast flush so tracker → dashboard e2e does not wait 30s for Parquet.
allow_ephemeral = true
wal_fsync_interval_ms = 0
parquet_flush_rows = 1
parquet_flush_interval_s = 1

[limits]
ingest_batch_size = 1
ingest_flush_interval_ms = 50
