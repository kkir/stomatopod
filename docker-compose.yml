services:
  stomatopod:
    # Use the published image, or build locally with `docker compose build`.
    image: ghcr.io/kkir/stomatopod:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      # REQUIRED — a long random string. Export it in your shell or a .env file.
      STOMATOPOD_AUTH__SECRET_KEY: "${STOMATOPOD_AUTH__SECRET_KEY:?set a long random secret}"
      # Public URL used to build share-link / email-digest URLs (no trailing slash).
      # STOMATOPOD_BASE_URL: "https://analytics.example.com"
    volumes:
      # Named volume keeps all analytics data across `docker compose up/down`
      # and image redeploys. Do NOT replace with an anonymous mount.
      - stomatopod_data:/app/data
    restart: unless-stopped

volumes:
  stomatopod_data:
