[workspace]
members = [
    "crates/core",
    "crates/store",
    "crates/ingest",
    "crates/query",
    "crates/web",
    "bin/stomatopod",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
rust-version = "1.76"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }
# HTTP
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["compression-gzip", "cors", "trace"] }
# Storage — embedded
datafusion = "43"
arrow = "53"
parquet = { version = "53", features = ["async"] }
rusqlite = { version = "0.31", features = ["bundled"] }
crossbeam = "0.8"
bincode = "1"
zstd = "0.13"
crc32fast = "1"
# Storage — postgres
sqlx = { version = "0.7", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "migrate"] }
# Storage — clickhouse
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hashing / crypto
blake3 = "1"
argon2 = "0.5"
# Templates
minijinja = { version = "2", features = ["loader"] }
# Config
config = "0.14"
# Geo
maxminddb = "0.23"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Errors
thiserror = "1"
anyhow = "1"
# Time
chrono = { version = "0.4", features = ["serde"] }
# IDs
ulid = { version = "1", features = ["serde"] }
# Async traits
async-trait = "0.1"
# Utils
memchr = "2"
parking_lot = "0.12"
bytes = "1"
cookie = "0.18"
clap = { version = "4", features = ["derive", "env"] }
