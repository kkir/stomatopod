# Stomatopod configuration reference.
# Copy this file to stomatopod.toml and adjust as needed.
# All values shown are the defaults unless noted otherwise.
# Every setting can also be overridden by an environment variable:
#   STOMATOPOD_<SECTION>__<KEY>=value  (double-underscore as separator)
# Example: STOMATOPOD_AUTH__SECRET_KEY=mysecret

# Server listen address.
[listen]
host = "0.0.0.0"
port = 8080

# Public base URL used for dashboard links in digests and Secure cookies.
# No trailing slash. Defaults to http://localhost:8080.
# base_url = "https://analytics.example.com"

# Authentication.  secret_key is required and has no default.
# Self-hosted mode is single-owner: one org + one admin user (many sites OK).
# First boot also requires STOMATOPOD_ADMIN_PASSWORD (min 12 chars).
[auth]
secret_key = ""          # REQUIRED — set a long random string
session_ttl_s = 2592000 # 30 days (embedded in the signed session token)
# cookie_secure = true   # force Secure cookie; default: true when base_url is https
# trust_forwarded_headers = true  # set false if exposed without a reverse proxy

# Storage backend.  Only "embedded" is currently implemented.
[storage]
backend = "embedded"
# All state (SQLite metadata, WAL, Parquet files) lives here. In a container
# this MUST be a mounted volume or the server refuses to start, because the data
# would otherwise be wiped on every redeploy. Override with
# STOMATOPOD_STORAGE__DATA_DIR. See DEPLOY.md.
data_dir = "./data"
# Group-commit fsync cadence for the write-ahead log (ms). Appends are
# flushed to the OS page cache immediately; durable fsync is batched at
# this interval. Sealed WAL segments are deleted after a successful
# Parquet flush once the in-memory buffer is empty.
wal_fsync_interval_ms = 200
parquet_flush_rows = 50000
parquet_flush_interval_s = 30
# Set true (or STOMATOPOD_STORAGE__ALLOW_EPHEMERAL=true) to allow running on
# ephemeral container storage for throwaway demos/tests. Data is lost on redeploy.
allow_ephemeral = false

# Optional MaxMind GeoLite2-City database for country/region lookup.
[geo]
# mmdb_path = "/var/lib/stomatopod/GeoLite2-City.mmdb"

# Ingest pipeline tuning.
[limits]
ingest_channel_size = 8192
ingest_batch_size = 1000
ingest_flush_interval_ms = 100
max_events_per_request = 10
