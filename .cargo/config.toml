[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# The stomatopod-web wasm client pulls getrandom 0.3 transitively via
# ulid -> rand. The wasm_js backend requires this cfg flag in addition to the
# `getrandom-v3` feature in crates/web/Cargo.toml.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]
