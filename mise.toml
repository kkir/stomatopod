[tools]
"cargo:cargo-nextest" = "latest"
"cargo:cargo-watch" = "latest"
"cargo:dioxus-cli" = "0.7.9"
rust = "stable"

[tasks."config:init"]
description = "Create stomatopod.toml from example if missing"
run = """
if [ -f stomatopod.toml ]; then
  echo "stomatopod.toml already exists"
  exit 0
fi
cp stomatopod.example.toml stomatopod.toml
echo "Created stomatopod.toml from stomatopod.example.toml"
echo "Set auth.secret_key in stomatopod.toml or export STOMATOPOD_AUTH__SECRET_KEY before running dev"
"""

[tasks."config:check"]
description = "Fail fast if auth.secret_key is not configured"
run = """
if [ -n "${STOMATOPOD_AUTH__SECRET_KEY:-}" ]; then
  exit 0
fi
if [ ! -f stomatopod.toml ]; then
  echo "Missing stomatopod.toml. Run: mise run config:init"
  exit 1
fi
if grep -Eq '^[[:space:]]*secret_key[[:space:]]*=[[:space:]]*"[^"]+"' stomatopod.toml; then
  exit 0
fi
echo "Missing auth.secret_key. Set it in stomatopod.toml or export STOMATOPOD_AUTH__SECRET_KEY"
exit 1
"""

[tasks.dev]
description = "Run the Dioxus dev server (dx serve): builds the wasm client + server, compiles Tailwind, and hot-reloads on change."
depends = ["config:check"]
run = """
CONFIG="$PWD/stomatopod.toml"
cd crates/web && dx serve --platform web @server --args="--config $CONFIG serve"
"""

[tasks.seed]
description = "Seed the running dev server with demo analytics traffic (pageviews + custom events)"
run = "cargo run -q -p stomatopod-seed --"

[tasks."dev:watch"]
description = "Run the dev server with file watching (rebuild the client separately via `mise run ui:build`)"
run = """
DIOXUS_PUBLIC_PATH="$PWD/target/dx/stomatopod/debug/web/public" \
  cargo watch -x 'run --bin stomatopod -- --config stomatopod.toml serve'
"""

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks."fmt:fix"]
description = "Fix Rust formatting"
run = "cargo fmt --all"

[tasks.lint]
description = "Run clippy with warnings denied"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks."lint:fix"]
description = "Run clippy with warnings denied and apply suggestions"
run = "cargo clippy --allow-dirty --all-targets --all-features --fix -- -D warnings"

[tasks.fix]
description = "Fix formatting and lint issues"
depends = ["fmt:fix", "lint:fix"]

[tasks.test]
description = "Run all Rust tests"
run = "cargo nextest run --all --all-features"

[tasks.check]
description = "Run formatting, lint, and tests"
depends = ["fmt", "lint", "test"]
run = "echo 'All checks complete'"

[tasks."ui:build"]
description = "Build the Dioxus fullstack app (debug): wasm client + server binary into target/dx/stomatopod/debug/web"
run = "cd crates/web && dx build --platform web"

[tasks."ui:bundle"]
description = "Release build of the fullstack app into target/dx/stomatopod/release/web ({server, public/})"
run = "cd crates/web && dx build --platform web --release"

[tasks."www:serve"]
description = "Dev-serve the marketing site (Dioxus fullstack + hot reload)"
run = "cd crates/www && dx serve --platform web"

[tasks."www:bundle"]
description = "SSG release build of the marketing site into target/dx/stomatopod-www/release/web/public (uses dx build: bundle skips SSG in CLI 0.7.9)"
# --force-sequential: client assets land in public/ before SSG writes HTML (avoids race).
run = "cd crates/www && dx build --platform web --ssg --release --force-sequential"

[tasks."e2e:install"]
description = "Install Playwright dependencies and Chromium browser"
run = """
npm --prefix tests/e2e ci
cd tests/e2e
npx playwright install chromium
"""

[tasks.e2e]
description = "Run Playwright end-to-end tests"
# `ui:build` produces the wasm client bundle the SSR server hydrates against
# (playwright.config.ts points DIOXUS_PUBLIC_PATH at it).
depends = ["e2e:install", "ui:build"]
run = "npm --prefix tests/e2e test"

[tasks."bench:memory"]
description = "Release-mode RSS + ingest RPS ladder (idle, warm, ~10/100/1000 RPS)"
run = "bash scripts/bench-memory.sh"
