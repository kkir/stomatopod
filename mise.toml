[tools]
"cargo:cargo-nextest" = "latest"
"cargo:cargo-watch" = "latest"
"cargo:dioxus-cli" = "0.7.9"
rust = "stable"

[tasks."config:init"]
description = "Create stomatopod.toml from example if missing"
run = """
if [ -f stomatopod.toml ]; then
  echo "stomatopod.toml already exists"
  exit 0
fi
cp stomatopod.example.toml stomatopod.toml
echo "Created stomatopod.toml from stomatopod.example.toml"
echo "Set auth.secret_key in stomatopod.toml or export STOMATOPOD_AUTH__SECRET_KEY before running dev"
"""

[tasks."config:check"]
description = "Fail fast if auth.secret_key is not configured"
run = """
if [ -n "${STOMATOPOD_AUTH__SECRET_KEY:-}" ]; then
  exit 0
fi
if [ ! -f stomatopod.toml ]; then
  echo "Missing stomatopod.toml. Run: mise run config:init"
  exit 1
fi
if grep -Eq '^[[:space:]]*secret_key[[:space:]]*=[[:space:]]*"[^"]+"' stomatopod.toml; then
  exit 0
fi
echo "Missing auth.secret_key. Set it in stomatopod.toml or export STOMATOPOD_AUTH__SECRET_KEY"
exit 1
"""

[tasks.dev]
description = "Run local development server"
depends = ["config:check"]
run = "cargo run --bin stomatopod -- --config stomatopod.toml serve"

[tasks."dev:watch"]
description = "Run local development server with file watching"
run = "cargo watch -x 'run --bin stomatopod -- --config stomatopod.toml serve'"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks."fmt:fix"]
description = "Fix Rust formatting"
run = "cargo fmt --all"

[tasks.lint]
description = "Run clippy with warnings denied"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks."lint:fix"]
description = "Run clippy with warnings denied and apply suggestions"
run = "cargo clippy --allow-dirty --all-targets --all-features --fix -- -D warnings"

[tasks.test]
description = "Run all Rust tests"
run = "cargo nextest run --all --all-features"

[tasks.check]
description = "Run formatting, lint, and tests"
depends = ["fmt", "lint", "test"]
run = "echo 'All checks complete'"

[tasks."ui:dev"]
description = "Run the Dioxus SPA dev server with hot reload"
run = "cd crates/ui && dx serve"

[tasks."ui:bundle"]
description = "Build the Dioxus SPA release bundle and copy it into crates/web/ui-dist"
run = """
# Clean the dx output and destination first: dx keeps old content-hashed
# assets across builds, which would otherwise pile up stale files in ui-dist.
rm -rf target/dx/stomatopod-ui/release/web/public
(cd crates/ui && dx bundle --release)
mkdir -p crates/web/ui-dist
find crates/web/ui-dist -mindepth 1 ! -name '.gitkeep' -delete
cp -r target/dx/stomatopod-ui/release/web/public/. crates/web/ui-dist/
"""

[tasks."e2e:install"]
description = "Install Playwright dependencies and Chromium browser"
run = """
npm --prefix tests/e2e ci
cd tests/e2e
npx playwright install chromium
"""

[tasks.e2e]
description = "Run Playwright end-to-end tests"
depends = ["e2e:install"]
run = "npm --prefix tests/e2e test"
