[package]
name = "stomatopod-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dioxus = { version = "0.7.9", features = ["web", "router"] }
stomatopod-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = ["Window", "Location", "RequestCredentials"] }

# stomatopod-core -> ulid -> rand 0.9 pulls getrandom 0.3 transitively, which
# needs its wasm_js backend enabled explicitly on wasm32 (see .cargo/config.toml
# for the matching --cfg rustflag).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom-v3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
