[package]
name = "stomatopod-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Stomatopod dashboard UI and self-hosted server binary"

[lib]
name = "stomatopod_web"
path = "src/lib.rs"

# The fullstack server binary. `dx` builds this crate twice: to wasm with the
# `web` feature (the hydrating client) and to native with `server` (the axum
# server that SSRs the app, serves assets, and runs server functions plus the
# existing REST API). `default = ["server"]` so a plain `cargo build`/`cargo
# test` in the workspace builds the native server.
[[bin]]
name = "stomatopod"
path = "src/main.rs"

[features]
default = ["server"]
# Browser build: hydrate the server-rendered app.
web = ["dioxus/web"]
# Native build: axum server, SSR, server functions, and the REST API.
server = [
    "dioxus/server",
    "dep:dioxus-server",
    "dep:stomatopod-api",
    "dep:stomatopod-alerts",
    "dep:stomatopod-ingest",
    "dep:stomatopod-store",
    "dep:tokio",
    "dep:axum",
    "dep:axum-extra",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:anyhow",
    "dep:ulid",
    "dep:argon2",
    "dep:blake3",
    "dep:hex",
    "dep:getrandom",
    "dep:dashmap",
    "dep:config",
    "dep:clap",
]

[dependencies]
# Shared across both builds: the app component, router, pages, and DTOs.
dioxus = { version = "0.7.9", features = ["fullstack", "router"] }
stomatopod-ui = { path = "../ui" }
stomatopod-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# Server-only. Optional + gated behind the `server` feature so the wasm client
# build never pulls axum/tokio/datafusion.
dioxus-server = { version = "0.7.9", optional = true }
stomatopod-api = { path = "../api", optional = true }
stomatopod-alerts = { path = "../alerts", optional = true }
stomatopod-ingest = { path = "../ingest", optional = true }
stomatopod-store = { path = "../store", optional = true }
tokio = { workspace = true, optional = true }
axum = { version = "0.8", features = ["macros"], optional = true }
axum-extra = { version = "0.10", features = ["cookie", "query"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "trace"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
ulid = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
hex = { version = "0.4", optional = true }
getrandom = { version = "0.2", optional = true }
dashmap = { version = "6", optional = true }
config = { workspace = true, optional = true }
clap = { workspace = true, optional = true }

# Browser-only crates. Target-gated so they compile only for the wasm client;
# `src/ui/api.rs` uses them behind the same `cfg(target_arch = "wasm32")`.
#
# stomatopod-core -> ulid -> rand 0.9 pulls getrandom 0.3 transitively, which
# needs its wasm_js backend enabled explicitly on wasm32 (see .cargo/config.toml
# for the matching --cfg rustflag).
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Navigator",
    "Clipboard",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "DomRect",
    "DomRectReadOnly",
    "Event",
    "EventTarget",
    "Node",
    "NodeList",
    "RequestCredentials",
    "Storage",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
] }
getrandom-v3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tempfile = { workspace = true }
http-body-util = { workspace = true }
argon2 = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
dashmap = "6"
blake3 = { workspace = true }
hex = "0.4"
reqwest = { workspace = true }
stomatopod-store = { path = "../store" }
stomatopod-ingest = { path = "../ingest" }
stomatopod-alerts = { path = "../alerts" }
stomatopod-api = { path = "../api" }
